# Copy to config.toml and fill in.  config.toml is git-ignored.
# Easiest path: just run `nocfo-sync` with no arguments — the TUI walks you
# through the token, then creates one mapping (business + Drive folder +
# NoCFO destination) and writes this file for you.

[nocfo]
# Shared by every mapping below.
# Production (default): https://api.nocfo.io   Test: https://api-tst.nocfo.io
base_url = "https://api.nocfo.io"
token = "your-personal-access-token"
# Send Idempotency-Key on uploads (see README: api-tst rejects it with 500).
idempotency = true

# One [[mapping]] block per Google Drive folder → NoCFO destination sync.
# Mappings have no name: they are identified by the Drive source folder.
# The TUI adds these for you; they are shown here for hand-editing.
[[mapping]]
business_slug = "your-business-slug"
# Google Drive for Desktop mount point.  If omitted, the first signed-in
# account under ~/Library/CloudStorage/GoogleDrive-*/My Drive is used.
mount = "~/Library/CloudStorage/GoogleDrive-you@example.com/My Drive"
# Folder to sync, relative to the mount.
root_folder = "Receipts"
# NoCFO destination folder id.  Omit the line entirely to use the NoCFO root.
# destination_folder_id = 1234
# The destination's display name, remembered when it is picked so the TUI can
# show it without another API call.  Optional; filled in automatically when the
# TUI views a mapping whose name is missing.
# destination_folder_name = "Receipts 2026"
# Whether a destination was chosen at all.  Distinguishes "not chosen yet"
# (false) from "chose the NoCFO root" (true with no destination_folder_id).
destination_selected = true
# Name of this mapping's sync database (.state/<state_file>.db).  Assigned
# automatically the first time the config is saved; keep it stable.
# state_file = "receipts"
