[project]
name = "nocfo-sync"
version = "0.1.0"
description = "Sync a Google Drive folder (via the macOS Drive-for-Desktop mount) into NoCFO files/folders"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "textual>=0.80",
]

[project.scripts]
nocfo-sync = "nocfo_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocfo_sync"]
